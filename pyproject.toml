[project]
name = "food-runner"
version = "0.1.0"
description = "Endless runner de 3 pistas com tematica de alimentacao saudavel"
readme = "README.md"
authors = [
    { name = "Vitor Rezende", email = "vgcrrzd@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pygame-ce>=2.5.8",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["testes"]
pythonpath = ["."]
